<style>
:root{--ground:#F7F4EE;--surface:#FFFFFF;--ink:#16211D;--muted:#47534E;--subtle:#6A7570;--hair:#E6DFD3;
--pine:#1A6B58;--pine-deep:#0E3B31;--pine-50:#EEF6F2;--ember:#D35F26;--gold:#E29A2D}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--ground);color:var(--ink);line-height:1.7;font-size:16px}
.hero{background:linear-gradient(135deg,#07231D 0%,#0E3B31 50%,#14574A 100%);color:#fff;padding:40px 16px 72px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-120px;top:-140px;width:380px;height:380px;border-radius:50%;background:radial-gradient(rgba(236,122,60,.35),rgba(236,122,60,0) 70%)}
.hero:after{content:"";position:absolute;left:-140px;bottom:-160px;width:380px;height:380px;border-radius:50%;background:radial-gradient(rgba(47,191,156,.28),rgba(47,191,156,0) 70%)}
.hero-in{max-width:820px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;color:#fff;text-decoration:none}
.logo{width:48px;height:48px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);flex:none}
.brand b{font-size:20px;letter-spacing:-.2px}
.brand span{display:block;font-size:13px;color:#9CB5AC;font-weight:500}
h1{font-size:34px;line-height:1.2;letter-spacing:-.6px}
.date{color:#D3E6DF;font-size:14px;margin-top:8px}
main{max-width:820px;margin:-44px auto 0;padding:0 16px 56px;position:relative;z-index:2}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:22px;padding:28px 24px;box-shadow:0 10px 30px rgba(14,59,49,.06)}
.summary{background:var(--pine-50);border:1px solid #CFE6DC;border-radius:16px;padding:18px 18px 6px;margin-bottom:8px}
.summary p,.summary li{color:var(--pine-deep)}
h2{font-size:20px;letter-spacing:-.2px;margin:34px 0 10px;padding-top:18px;border-top:1px solid var(--hair);color:var(--pine-deep)}
h2:first-of-type{border-top:none;padding-top:0}
h3{font-size:16px;margin:18px 0 6px;color:var(--ink)}
p,li{color:var(--muted);margin-bottom:10px}
ul{padding-left:22px;margin-bottom:10px}
strong{color:var(--ink)}
a{color:var(--pine);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--hair);vertical-align:top;color:var(--muted)}
th{color:var(--ink);background:#FBF9F5}
.note{border-left:4px solid var(--ember);background:#FEF4EC;padding:14px 16px;border-radius:0 12px 12px 0;margin:14px 0}
.note p{color:#7A3A14;margin:0}
.toc{columns:2;column-gap:24px;list-style:none;padding-left:0;margin:8px 0 0}
.toc li{margin-bottom:4px}
footer{max-width:820px;margin:0 auto;padding:0 16px 40px;color:var(--subtle);font-size:14px;text-align:center}
@media (max-width:600px){h1{font-size:28px}.card{padding:22px 16px}.toc{columns:1}th,td{padding:8px 6px}}

.links{display:grid;gap:14px;margin-top:6px}
.link{display:block;border:1px solid var(--hair);border-radius:18px;padding:18px 20px;background:#fff;color:var(--ink)}
.link:hover{border-color:var(--pine);text-decoration:none}
.link b{display:block;font-size:18px;color:var(--pine-deep)}
.link span{color:var(--subtle);font-weight:500}
</style>
</head>
